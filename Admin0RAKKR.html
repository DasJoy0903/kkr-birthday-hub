<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KKR Birthday Hub — Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      color: #ffffff;
      background:
        radial-gradient(circle at top, #4b2375 0, #160b26 45%, #09050f 100%);
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 30px 20px 60px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .logo {
      color: #f4d06f;
      font-size: 24px;
      font-weight: 800;
    }

    .back {
      color: #f4d06f;
      text-decoration: none;
      font-size: 14px;
    }

    .card {
      padding: 25px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 25px;
    }

    h1 {
      margin-bottom: 8px;
    }

    h2 {
      margin-bottom: 20px;
    }

    .subtitle {
      color: #bdb3c8;
      margin-bottom: 25px;
      line-height: 1.6;
    }

    .notice {
      padding: 14px 16px;
      margin-bottom: 20px;
      border-radius: 12px;
      background: rgba(244,208,111,0.10);
      border: 1px solid rgba(244,208,111,0.25);
      color: #e8dff0;
      font-size: 13px;
      line-height: 1.6;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: #d9cfe2;
      font-size: 13px;
      font-weight: 600;
    }

    input,
    select {
      width: 100%;
      padding: 13px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.07);
      color: #ffffff;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #f4d06f;
    }

    select option {
      color: #111111;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 700;
    }

    .primary {
      background: #f4d06f;
      color: #251039;
    }

    .secondary {
      background: rgba(255,255,255,0.10);
      color: #ffffff;
    }

    .danger {
      background: rgba(220,60,80,0.18);
      color: #ff9eaa;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .search {
      margin-bottom: 20px;
    }

    .player-list {
      display: grid;
      gap: 12px;
    }

    .player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 15px;
      border-radius: 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .player-info {
      min-width: 0;
    }

    .player-name {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .player-meta {
      color: #aaa0b5;
      font-size: 12px;
      line-height: 1.6;
    }

    .row-buttons {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .small-button {
      padding: 8px 12px;
      font-size: 12px;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
      font-size: 13px;
      line-height: 1.5;
    }

    .status.success {
      display: block;
      background: rgba(70,180,100,0.12);
      color: #9de3aa;
      border: 1px solid rgba(70,180,100,0.25);
    }

    .status.error {
      display: block;
      background: rgba(220,60,80,0.12);
      color: #ff9eaa;
      border: 1px solid rgba(220,60,80,0.25);
    }

    .empty {
      text-align: center;
      color: #aaa0b5;
      padding: 25px;
    }

    @media (max-width: 650px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .header {
        align-items: flex-start;
      }

      .player-row {
        flex-direction: column;
        align-items: flex-start;
      }

      .row-buttons {
        width: 100%;
      }

      .row-buttons button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">
      💜 KKR Birthday Hub Admin
    </div>

    <a class="back" href="index.html">
      ← Back to Website
    </a>

  </div>


  <!-- PLAYER FORM -->

  <div class="card">

    <h1>Player Management</h1>

    <p class="subtitle">
      Manage KKR player information from one place.
    </p>

    <div class="notice">
      🔐 Admin tools update the Google Sheet through your Apps Script.
      Keep this page private and do not share the admin URL publicly.
    </div>


    <form id="playerForm">

      <!-- Stores the actual Google Sheet row number when editing -->
      <input
        type="hidden"
        id="editRowNumber"
        value=""
      >


      <div class="form-grid">


        <!-- PLAYER NAME -->

        <div class="field">

          <label for="playerName">
            Player Name
          </label>

          <input
            id="playerName"
            type="text"
            placeholder="e.g. Rinku Singh"
            required
          >

        </div>


        <!-- DOB -->

        <div class="field">

          <label for="dob">
            Date of Birth
          </label>

          <input
            id="dob"
            type="date"
          >

        </div>


        <!-- STATUS -->

        <div class="field">

          <label for="status">
            Status
          </label>

          <select id="status">

            <option value="Current">
              Current
            </option>

            <option value="Former">
              Former
            </option>

          </select>

        </div>


        <!-- ROLE -->

        <div class="field">

          <label for="role">
            Role
          </label>

          <select id="role">

            <option value="Batter">
              Batter
            </option>

            <option value="Bowler">
              Bowler
            </option>

            <option value="All-Rounder">
              All-Rounder
            </option>

            <option value="Wicket-Keeper">
              Wicket-Keeper
            </option>

          </select>

        </div>


        <!-- SEASONS -->

        <div class="field">

          <label for="seasons">
            KKR Seasons
          </label>

          <input
            id="seasons"
            type="text"
            placeholder="e.g. 2024-Present"
          >

        </div>


        <!-- REMINDER -->

        <div class="field">

          <label for="reminder">
            Birthday Reminder
          </label>

          <select id="reminder">

            <option value="ON">
              ON
            </option>

            <option value="OFF">
              OFF
            </option>

          </select>

        </div>


        <!-- PHOTO -->

        <div class="field full">

          <label for="photoUrl">
            Photo URL
          </label>

          <input
            id="photoUrl"
            type="url"
            placeholder="https://..."
          >

        </div>

      </div>


      <div class="buttons">

        <button
          type="submit"
          class="primary"
          id="saveButton"
        >
          ➕ Add Player
        </button>


        <button
          type="button"
          class="secondary"
          id="cancelButton"
          style="display:none;"
        >
          Cancel Edit
        </button>

      </div>


      <div
        id="statusMessage"
        class="status"
      ></div>

    </form>

  </div>



  <!-- PLAYER LIST -->

  <div class="card">

    <h2>
      🏏 Players
    </h2>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="🔎 Search player..."
    >

    <div
      id="playerList"
      class="player-list"
    ></div>

  </div>

</div>



<script>


/*
 * GOOGLE APPS SCRIPT WEB APP
 */

const DATA_URL =
  "https://script.google.com/macros/s/AKfycbyc7nxx7Ewdj2uxtwu5EBbhv50EZO9wkVifCJZ6MIYDW07eosYq2RqOYKiCRcOqoOJM/exec";


let players = [];


const form =
  document.getElementById("playerForm");

const search =
  document.getElementById("search");

const playerList =
  document.getElementById("playerList");

const saveButton =
  document.getElementById("saveButton");

const cancelButton =
  document.getElementById("cancelButton");

const statusMessage =
  document.getElementById("statusMessage");



/*
 * LOAD PLAYERS
 */

async function loadPlayers() {

  try {

    const response =
      await fetch(DATA_URL);

    if (!response.ok) {

      throw new Error(
        "Unable to load players"
      );

    }

    players =
      await response.json();

    renderPlayers();

  }

  catch (error) {

    console.error(error);

    playerList.innerHTML =
      `<div class="empty">
        Unable to load player data.
      </div>`;

  }

}



/*
 * STATUS MESSAGE
 */

function showStatus(message, type) {

  statusMessage.textContent =
    message;

  statusMessage.className =
    `status ${type}`;

}


function clearStatus() {

  statusMessage.textContent =
    "";

  statusMessage.className =
    "status";

}



/*
 * HTML SECURITY
 */

function escapeHtml(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}



/*
 * DISPLAY PLAYERS
 */

function renderPlayers() {

  const query =
    search.value
      .toLowerCase()
      .trim();


  const filtered =
    players.filter(player =>
      String(player.name || "")
        .toLowerCase()
        .includes(query)
    );


  if (!filtered.length) {

    playerList.innerHTML =
      `<div class="empty">
        No players found.
      </div>`;

    return;

  }


  playerList.innerHTML =
    filtered.map(player => {


      const originalIndex =
        players.indexOf(player);


      /*
       * Google Sheet:
       *
       * Row 1 = Header
       * Row 2 = First Player
       *
       * Therefore:
       * sheet row = array index + 2
       */

      const sheetRowNumber =
        originalIndex + 2;


      let dobText =
        "Birthday pending";


      if (player.dob) {

        dobText =
          new Date(
            player.dob + "T00:00:00"
          ).toLocaleDateString(
            "en-IN",
            {
              day: "numeric",
              month: "long",
              year: "numeric"
            }
          );

      }


      return `

        <div class="player-row">


          <div class="player-info">

            <div class="player-name">

              ${escapeHtml(
                player.name
              )}

            </div>


            <div class="player-meta">

              🎂 ${dobText}

              • 🏏 ${escapeHtml(
                player.role || "Player"
              )}

              • ${escapeHtml(
                player.status || "Unknown"
              )}

              ${
                player.seasons
                  ? ` • 📅 ${escapeHtml(
                      player.seasons
                    )}`
                  : ""
              }

            </div>

          </div>


          <div class="row-buttons">


            <button
              class="secondary small-button"
              onclick="editPlayer(
                ${originalIndex},
                ${sheetRowNumber}
              )"
            >
              ✏️ Edit
            </button>


            <button
              class="danger small-button"
              onclick="deletePlayer(
                ${originalIndex}
              )"
            >
              🗑️ Delete
            </button>


          </div>


        </div>

      `;

    }).join("");

}



/*
 * EDIT PLAYER
 */

function editPlayer(
  index,
  rowNumber
) {

  const player =
    players[index];


  if (!player) {
    return;
  }


  /*
   * Save the real Google Sheet row.
   */

  document.getElementById(
    "editRowNumber"
  ).value =
    rowNumber;


  document.getElementById(
    "playerName"
  ).value =
    player.name || "";


  document.getElementById(
    "dob"
  ).value =
    player.dob || "";


  document.getElementById(
    "status"
  ).value =
    player.status === "former"
      ? "Former"
      : "Current";


  document.getElementById(
    "role"
  ).value =
    player.role || "Batter";


  document.getElementById(
    "seasons"
  ).value =
    player.seasons || "";


  /*
   * The current public doGet()
   * does not return the Reminder column.
   *
   * We keep ON here for now.
   */

  document.getElementById(
    "reminder"
  ).value =
    "ON";


  document.getElementById(
    "photoUrl"
  ).value =
    player.photoUrl || "";


  saveButton.textContent =
    "💾 Update Player";


  cancelButton.style.display =
    "inline-block";


  clearStatus();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}



/*
 * RESET FORM
 */

function resetForm() {

  form.reset();


  document.getElementById(
    "editRowNumber"
  ).value =
    "";


  document.getElementById(
    "status"
  ).value =
    "Current";


  document.getElementById(
    "role"
  ).value =
    "Batter";


  document.getElementById(
    "reminder"
  ).value =
    "ON";


  saveButton.textContent =
    "➕ Add Player";


  cancelButton.style.display =
    "none";


  clearStatus();

}



/*
 * SEND POST REQUEST
 */

async function sendRequest(
  payload
) {

  const response =
    await fetch(
      DATA_URL,
      {
        method: "POST",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(payload)
      }
    );


  const result =
    await response.json();


  if (!result.success) {

    throw new Error(
      result.message ||
      "Request failed"
    );

  }


  return result;

}



/*
 * ADD / UPDATE PLAYER
 */

form.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    clearStatus();


    const rowNumber =
      document.getElementById(
        "editRowNumber"
      ).value;


    const player = {

      name:
        document.getElementById(
          "playerName"
        ).value.trim(),

      dob:
        document.getElementById(
          "dob"
        ).value,

      status:
        document.getElementById(
          "status"
        ).value,

      role:
        document.getElementById(
          "role"
        ).value,

      seasons:
        document.getElementById(
          "seasons"
        ).value.trim(),

      reminder:
        document.getElementById(
          "reminder"
        ).value,

      photoUrl:
        document.getElementById(
          "photoUrl"
        ).value.trim()

    };


    if (!player.name) {

      showStatus(
        "Please enter the player name.",
        "error"
      );

      return;

    }


    saveButton.disabled =
      true;


    try {


      /*
       * EDIT MODE
       */

      if (rowNumber) {

        saveButton.textContent =
          "Updating...";


        await sendRequest({

          action:
            "updatePlayer",

          rowNumber:
            Number(rowNumber),

          player:
            player

        });


        showStatus(
          `${player.name} was updated successfully.`,
          "success"
        );

      }


      /*
       * ADD MODE
       */

      else {

        saveButton.textContent =
          "Saving...";


        await sendRequest({

          action:
            "addPlayer",

          player:
            player

        });


        showStatus(
          `${player.name} was added successfully.`,
          "success"
        );

      }


      resetForm();


      await loadPlayers();


    }

    catch (error) {

      console.error(error);


      showStatus(
        error.message ||
        "Unable to save the player.",
        "error"
      );


      saveButton.textContent =
        rowNumber
          ? "💾 Update Player"
          : "➕ Add Player";

    }


    finally {

      saveButton.disabled =
        false;

    }

  }
);



/*
 * DELETE
 *
 * We will connect this after
 * Edit has been successfully tested.
 */

function deletePlayer(index) {

  const player =
    players[index];


  if (!player) {
    return;
  }


  showStatus(
    `Delete is not connected yet. ${player.name} has not been deleted.`,
    "error"
  );

}



/*
 * CANCEL EDIT
 */

cancelButton.addEventListener(
  "click",
  resetForm
);



/*
 * SEARCH
 */

search.addEventListener(
  "input",
  renderPlayers
);



/*
 * START
 */

loadPlayers();

</script>

</body>
</html>
